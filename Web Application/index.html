<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoGestión - EMEC</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="newstyles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400..900&display=swap" rel="stylesheet">
</head>

<body class="gradient-bg">

    <header class="p-4 text-center text-white">
        <h1 class="fw-bold m-0" style="font-size: 1.8rem; letter-spacing: 1px;">
            Escuela Municipal de Economía Circular
        </h1>
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center my-4">
        
        <div class="sitmas-card w-100 mx-3" style="max-width: 420px;">
            <h2 class="text-center mb-4">Iniciar Sesión</h2>
            
            <form id="form-login">
                <div class="mb-3">
                    <label for="usuario" class="form-label fw-semibold text-secondary">Usuario</label>
                    <input type="text" id="usuario" class="form-control form-control-lg" placeholder="Ej: juanvidela@emec.com">
                    <span class="error-msg mt-1" id="error-user" style="display: none; color: #ff4d4d;">*Usuario no encontrado</span>
                </div>

                <div class="mb-4">
                    <label for="contraseña" class="form-label fw-semibold text-secondary">Contraseña</label>
                    <input type="password" id="contraseña" class="form-control form-control-lg">
                    <span class="error-msg mt-1" id="error-pass" style="display: none; color: #ff4d4d;">*Contraseña incorrecta</span>
                </div>

                <button type="submit" class="btn btn-sitmas-success btn-lg w-100 py-2 shadow-sm" id="boton_ingreso">
                    Ingresar
                </button>
            </form>
        </div>
        
    </main>

    <footer class="footer-liston">
        <div class="container text-center">
            <div class="d-flex flex-wrap justify-content-center gap-4 align-items-center">
                <img src="assets/biocba_sinfondo.png" alt="Ente BioCórdoba" class="logo-inst">
                <img src="assets/espacios_verdes_sinfondo.png" alt="Espacios Verdes" class="logo-inst">
                <img src="assets/ambiente_sinfondo.png" alt="Secretaría de Ambiente" class="logo-inst">
                <img src="assets/escudo1_sinfondo.png" alt="Municipalidad de Córdoba" class="logo-inst">
                <img src="assets/escudo2_contexto_sinfondo.png" alt="Córdoba Capital" class="logo-inst">
            </div>
        </div>
    </footer>

</body>

<script src="Js/login.js"></script>
</html>
