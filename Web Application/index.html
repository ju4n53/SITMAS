<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioCba - Sitmas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="newstyles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400..900&display=swap" rel="stylesheet">
</head>

<body class="gradient-bg d-flex flex-column min-vh-100">

    <header class="p-4 text-center">
        <img src="assets/biocba-solo-noBG.png" alt="Ente Municipal BioCórdoba" class="logo-header-login">
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center my-4">

        <div class="login-transparent-container w-100 mx-3" style="max-width: 420px;">
            <!-- <h2 class="text-center mb-4">Iniciar Sesión</h2> -->

            <form id="form-login">
                <div class="mb-3">
                    <input type="text" id="usuario" class="form-control form-control-lg login-input-rounded"
                        placeholder="Ingresá tu usuario" required maxlength="40" autocomplete="username">

                    <span class="error-msg mt-1" id="error-user"
                        style="display: none; color: #ff4d4d; font-weight: 600;">
                        * Usuario no encontrado
                    </span>
                </div>

                <div class="mb-4">
                    <input type="password" id="contraseña" class="form-control form-control-lg login-input-rounded"
                        placeholder="Ingresá tu contraseña" required maxlength="25" autocomplete="current-password">

                    <span class="error-msg mt-1" id="error-pass"
                        style="display: none; color: #ff4d4d; font-weight: 600;">
                        * Contraseña incorrecta
                    </span>
                </div>

                <button type="submit" class="btn btn-login-custom btn-lg w-100 py-2.5 shadow-sm" id="boton_ingreso">
                    Ingresar
                </button>
            </form>
        </div>

    </main>

    <footer class="footer-liston mt-auto">
        <div class="container text-center">
            <div class="d-flex flex-wrap justify-content-center gap-4 align-items-center">
                <img src="assets/footer-logos.png" alt="Logos Institucionales" class="logo-inst">
            </div>
        </div>
    </footer>

</body>

<script src="Js/login.js"></script>

</html>
